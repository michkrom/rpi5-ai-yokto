# yokto layer - Raspberry Pi 5 specific fixes
# This layer persists customizations across rebuilds

BBFILE_COLLECTIONS += "yokto"
BBFILE_PATTERN_yokto = "^${LAYERDIR}/"
BBFILE_PRIORITY_yokto = "6"

LAYERDEPENDS_yokto = "core"
LAYERSERIES_COMPAT_yokto = "scarthgap"

# Include the layer in BBLAYERS
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"