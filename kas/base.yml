# Base configuration - Raspberry Pi 5 (scarthgap)
# Base for all other levels. Use: kas build kas/base.yml:<level>.yml
# Or build directly: kas build kas/base.yml

header:
  version: 18

machine: raspberrypi5
distro: poky

target:
  - core-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    refspec: scarthgap
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-raspberrypi:
    # Pin to the EXACT commit that the known-good ../poky-rpi build is on
    # (2c646d2 "rpi-config: ENABLE_UART for CM5 IO Board", scarthgap). Our
    # previously-diverged scarthgap HEAD differed in recipes-kernel/linux and
    # boot files; this mirrors the proven-boot layer exactly.
    url: https://github.com/agherzan/meta-raspberrypi
    refspec: 2c646d29912dcc873469a57b1c207e1549c5094d
    path: layers/meta-raspberrypi

  meta-base:
    path: layers/meta-base

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    refspec: scarthgap
    path: layers/meta-swupdate

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    DISTRO = "poky"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    INIT_MANAGER = "systemd"
    IMAGE_FSTYPES = "wic.bz2"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    IONICE = ""
    BB_TASK_NICE_LEVEL = ""
    # MATCH the known-good ../poky-rpi build (which boots): do NOT enable the
    # UART console here. poky-rpi's boot partition is just
    #   config.txt  -> dtoverlay=vc4-kms-v3d  (no enable_uart)
    #   cmdline.txt -> ... root=.../mmcblk0p2 ...  (no console=serial0)
    # ENABLE_UART=1 injected BOTH 'enable_uart=1' (config.txt) AND
    # 'console=serial0,115200' (cmdline.txt, via rpi-cmdline CMDLINE_SERIAL)
    # and that combination hangs after BL31 on the Pi5. Leave them unset so the
    # kernel console falls back to the DTB stdout-path exactly like the working
    # poky-rpi image.
    # Raspberry Pi config: keep BASE minimal/headless -> leave RPI_EXTRA_CONFIG
    # UNSET here. meta-raspberrypi already adds 'dtoverlay=vc4-kms-v3d' for vc4
    # machines, which is exactly what the working base uses. NOTE: do NOT set
    # RPI_EXTRA_CONFIG in base.yml - kas emits level headers in an order where
    # base's assignment would override gui.yml's display config (last wins). The
    # vc4-kms-v3d-pi5 / disable_fw_kms_setup display settings hung after BL31,
    # so they must only ever be set by the GUI layer (gui.yml), never base.
    # Do NOT override the kernel version here - use the default from the
    # pinned meta-raspberrypi commit (rpi-default-versions.inc defaults to
    # linux-raspberrypi 6.6.% = 6.6.63, exactly what ../poky-rpi boots).
    # Use meta-raspberrypi mesa 25.1.6 (supports vc4/v3d drivers for RPi)
    # COMPATIBLE_MACHINE fix for raspberrypi5 is in meta-base mesa_.bbappend
    PREFERRED_VERSION:pn-mesa = "25.1.6%"
    # Keep weston (labwc not available in scarthgap)
    RDEPENDS:weston:append = " pixman"
    # Enable OpenGL support
    DISTRO_FEATURES:append = " opengl"
  runtime-deps: |
    RDEPENDS:cairo:append = " pixman"
    RDEPENDS:glib-2.0:append = " libpcre2"
  qa-skip: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:glib-2.0-ptest += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"
    INSANE_SKIP:grep += "file-rdeps"
  tools: |
    CORE_IMAGE_EXTRA_INSTALL += "util-linux pciutils usbutils i2c-tools vim curl wget python3 file ldd binutils"
  swupdate: |
    # CORE_IMAGE_EXTRA_INSTALL += "swupdate swupdate-apply swupdate-cfg"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  users: |
    # Add pi user to video and render groups for SDL2/EGL access
    EXTRA_USERS = "usermod -a -G video,render pi;"
  00_image-name: |
    IMAGE_NAME = "image-base"
  wks: |
    WKS_FILE = "sdimage-raspberrypi.wks"
    WKS_SEARCH_PATH:prepend = "${TOPDIR}/../kas:"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  parallelism: |
    # Limit to 32 threads max to prevent OOM crashes when compiling Chromium
    BB_NUMBER_THREADS = "32"
    PARALLEL_MAKE = "-j 32"
  memory-management: |
    # Additional memory management for large compilations like Chromium
    BB_TASK_NICE_LEVEL = "5"
    BB_TASK_IONICE_LEVEL = "idle"
    # Reduce memory pressure during compilation
    TASKSET_MOZILLA = "true"