# Wayland configuration - extends base.yml
# Use: kas build kas/base.yml:wayland.yml

header:
  version: 18

target:
  - core-image-weston
  - yokto-wayland-swu

repos:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-multimedia:
      meta-python:

local_conf_header:
  01_wayland: |
    DISTRO_FEATURES:append = " wayland pam vulkan opengl"
    DISTRO_FEATURES:remove = " x11"
    CORE_IMAGE_EXTRA_INSTALL += "weston-examples mesa-megadriver alsa-utils"
    IMAGE_NAME = "image-wayland"
  skip-qa: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"