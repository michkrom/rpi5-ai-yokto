header:
  version: 18

target:
  - core-image-weston

repos:
  meta-browser:
    url: https://github.com/OSSystems/meta-browser
    refspec: 8413be0ef9e5e3ee3d07e5b2782e7918126c13da
    path: layers/meta-browser
    layers:
      meta-chromium:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
  meta-clang:
    url: https://github.com/kraj/meta-clang
    refspec: scarthgap-clang20
    path: layers/meta-clang
  rust-mixin:
    path: layers/meta-rust-mixin

local_conf_header:
  wayland: |
    DISTRO_FEATURES:append = " wayland pam"
    DISTRO_FEATURES:remove = " x11"
  chrome: |
    CORE_IMAGE_EXTRA_INSTALL += "chromium-ozone-wayland"
  skip-qa: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"