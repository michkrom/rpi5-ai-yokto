# Chrome configuration - extends games.yml
# Use: kas build kas/core.yml:wayland.yml:games.yml:chrome.yml

header:
  version: 18

target:
  - core-image-weston

repos:
  meta-browser:
    url: https://github.com/OSSystems/meta-browser
    refspec: 0dad36da5970315e53635b4b1c2013e1aec43a29
    path: layers/meta-browser
    layers:
      meta-chromium:

  meta-clang:
    url: https://github.com/kraj/meta-clang
    refspec: 5c602337ea1a80fb7217eeda04e396cf90587dca
    path: layers/meta-clang

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:

local_conf_header:
  chrome: |
    IMAGE_INSTALL:append = " chromium-ozone-wayland"
    IMAGE_NAME = "core-image-chrome"