# Games configuration - extends wayland.yml
# Use: kas build kas/base.yml:wayland.yml:games.yml

header:
  version: 18

target:
  - core-image-weston
  - yokto-games-swu

repos:
  meta-quake3:
    path: layers/meta-quake3
  meta-doom:
    path: layers/meta-doom
  meta-games:
    path: layers/meta-games
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-multimedia:
      meta-python:

local_conf_header:
  games: |
    CORE_IMAGE_EXTRA_INSTALL += "q3e chocolate-doom launcher mesa-megadriver egl-test sdl2-egl-test"
    IMAGE_NAME = "image-games"
    PREFERRED_VERSION:pn-mesa = "25.1.6%"
  y_rootfs-size: |
    IMAGE_ROOTFS_EXTRA_SPACE = "2097152"
  z_skip-qa: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"