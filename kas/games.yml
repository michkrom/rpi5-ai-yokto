header:
  version: 18

target:
  - core-image-weston

repos:
  meta-quake3:
    path: layers/meta-quake3
  meta-doom:
    path: layers/meta-doom
  meta-games:
    path: layers/meta-games
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-multimedia:
      meta-python:

local_conf_header:
  wayland: |
    DISTRO_FEATURES:append = " wayland pam"
    DISTRO_FEATURES:remove = " x11"
  games: |
    CORE_IMAGE_EXTRA_INSTALL += "q3e chocolate-doom game-launcher"
    # Warfork disabled - EGL/OpenGL issues
    # CORE_IMAGE_EXTRA_INSTALL += "warfork warfork-assets"
  rootfs-size: |
    IMAGE_ROOTFS_EXTRA_SPACE = "2097152"
  skip-qa: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"