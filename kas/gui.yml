# GUI configuration - extends base.yml
# Use: kas build kas/base.yml:gui.yml

header:
  version: 18

target:
  - core-image-weston

repos:
  meta-raspberrypi:
    path: layers/meta-raspberrypi

local_conf_header:
  01_gui: |
    IMAGE_NAME = "image-gui"
    CORE_IMAGE_EXTRA_INSTALL += " weston-examples mesa-megadriver alsa-utils libxml2"
    DISTRO_FEATURES:append = " wayland pam vulkan opengl"
    DISTRO_FEATURES:remove = " x11"
    # Kernel version is intentionally NOT overridden here - it inherits the
    # default (6.6.63) from the pinned meta-raspberrypi commit so we match the
    # known-good ../poky-rpi boot exactly.
    # Pi 5 display config for the Weston/GUI desktop (HDMI output). This lives
    # HERE (gui layer) and NOT in base.yml so the headless base stays boot-safe.
    # IMPORTANT (boot hang): do NOT append a second dtoverlay here. meta-raspberrypi's
    # rpi-config already writes 'dtoverlay=vc4-kms-v3d' (VC4DTBO default) into
    # config.txt. Adding 'dtoverlay=vc4-kms-v3d-pi5' as well leaves BOTH overlays
    # active, which hangs the RPi5 in the firmware stage (after BL31, black screen,
    # no serial) - exactly the failure the --all build hits while headless base
    # (only vc4-kms-v3d) boots. Instead override VC4DTBO so rpi-config writes the
    # single correct Pi5 overlay. max_framebuffers/arm_boost are benign.
    VC4DTBO = "vc4-kms-v3d-pi5"
    RPI_EXTRA_CONFIG = "max_framebuffers=2\narm_boost=1"
    PREFERRED_VERSION:pn-mesa = "25.1.6%"
    RDEPENDS:weston:append = " pixman"
    # Enable OpenGL support
    # RDEPENDS:weston:append = "lib Weston"
    # Keep weston (labwc not available in scarthgap)
  runtime-deps: |
    RDEPENDS:cairo:append = " pixman"
    RDEPENDS:glib-2.0:append = " libpcre2"
  qa-skip: |
    INSANE_SKIP:cairo += "file-rdeps"
    INSANE_SKIP:glib-2.0 += "file-rdeps"
    INSANE_SKIP:glib-2.0-ptest += "file-rdeps"
    INSANE_SKIP:weston += "file-rdeps"
    INSANE_SKIP:weston-examples += "file-rdeps"
    INSANE_SKIP:libweston-13 += "file-rdeps"
  tools: |
    CORE_IMAGE_EXTRA_INSTALL += "util-linux pciutils usbutils i2c-tools vim curl wget python3 file ldd binutils"
  swupdate: |
    # CORE_IMAGE_EXTRA_INSTALL += "swupdate swupdate-apply swupdate-cfg"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  users: |
    # Add pi user to video and render groups for SDL2/EGL access
    EXTRA_USERS = "usermod -a -G video,render pi;"
  wks: |
    WKS_FILE = "sdimage-raspberrypi.wks"
    WKS_SEARCH_PATH:prepend = "${TOPDIR}/../kas:"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  parallelism: |
    # Limit to 32 threads max to prevent OOM crashes when compiling Chromium
    BB_NUMBER_THREADS = "32"
    PARALLEL_MAKE = "-j 32"
  memory-management: |
    # Additional memory management for large compilations like Chromium
    BB_TASK_NICE_LEVEL = "5"
    BB_TASK_IONICE_LEVEL = "idle"
    # Reduce memory pressure during compilation
    TASKSET_MOZILLA = "true"
