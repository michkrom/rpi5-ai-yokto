# meta-ai layer - AI tools for Raspberry Pi 5
# Provides llama.cpp and whisper.cpp AI inference tools

# NOTE: Do NOT add a BBFILES line for ../meta-base here. meta-base is already
# included as its own layer (kas/base.yml -> bblayers.conf), so re-including it
# from this layer parses every meta-base recipe/bbappend twice. That made the
# libsdl2 SRC_URI:append (RTLD patch) run twice, breaking do_patch.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.inc"

BBFILE_COLLECTIONS += "ai"
BBFILE_PATTERN_ai = "^${LAYERDIR}/"
BBFILE_PRIORITY_ai = "10"
LAYERSERIES_COMPAT_ai = "scarthgap"