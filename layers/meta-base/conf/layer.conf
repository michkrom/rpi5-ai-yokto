# base layer - Raspberry Pi 5 specific fixes
# This layer persists customizations across rebuilds

BBFILE_COLLECTIONS += "base"
BBFILE_PATTERN_base = "^${LAYERDIR}/"
BBFILE_PRIORITY_base = "12"

LAYERDEPENDS_base = "core"
LAYERSERIES_COMPAT_base = "scarthgap"

# Include the layer in BBLAYERS
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*/*.bbappend"
BBFILES += "${LAYERDIR}/recipes-*/*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.inc"
BBFILES += "${LAYERDIR}/recipes-*/*/*/*.inc"